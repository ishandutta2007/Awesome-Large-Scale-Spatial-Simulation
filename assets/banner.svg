<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#080D1A"/><stop offset="50%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E1035"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="textGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38BDF8" stop-opacity=".4"/><stop offset="100%" stop-color="#0F172A" stop-opacity="0"/></radialGradient><radialGradient id="purpleOrb" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#A855F7" stop-opacity=".35"/><stop offset="100%" stop-color="#0F172A" stop-opacity="0"/></radialGradient></defs><style>@keyframes gridSweep{0%{transform:translateY(0)}}@keyframes pulseNode{0%{transform:scale(1);opacity:.6}50%{transform:scale(1.4);opacity:1}}@keyframes floatOrb1{0%{transform:translate(0,0)}50%{transform:translate(30px,-20px)}}@keyframes floatOrb2{0%{transform:translate(0,0)}50%{transform:translate(-25px,25px)}}@keyframes dashFlow{0%{stroke-dashoffset:100}}.grid-bg{animation:gridSweep 8s linear infinite}.orb-1{animation:floatOrb1 12s ease-in-out infinite}.orb-2{animation:floatOrb2 15s ease-in-out infinite}.node-pulse{animation:pulseNode 3s ease-in-out infinite;transform-origin:center}.flow-line{stroke-dasharray:8 12;animation:dashFlow 4s linear infinite}</style><rect width="1200" height="300" fill="url(#bgGrad)"/><circle cx="200" cy="80" r="180" fill="url(#cyanOrb)" class="orb-1"/><circle cx="1000" cy="220" r="220" fill="url(#purpleOrb)" class="orb-2"/><rect width="1200" height="340" y="-20" fill="url(#grid)" class="grid-bg"/><g fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"><path d="M 100 220 Q 250 120 450 180 T 800 100 T 1100 200" class="flow-line"/><path stroke="rgba(168, 85, 247, 0.25)" stroke-width="1.5" d="M 50 80 Q 300 240 600 140 T 950 250" class="flow-line" style="animation-duration:6s"/></g><g fill="#38BDF8"><circle cx="250" cy="135" r="4" class="node-pulse" style="animation-delay:0s"/><circle cx="450" cy="180" r="5" class="node-pulse" style="animation-delay:.8s" fill="#A855F7"/><circle cx="800" cy="100" r="4" class="node-pulse" style="animation-delay:1.4s"/><circle cx="950" cy="250" r="5" class="node-pulse" style="animation-delay:.4s" fill="#34D399"/><circle cx="150" cy="230" r="3" class="node-pulse" style="animation-delay:1.8s"/></g><g text-anchor="middle"><text x="600" y="132" fill="#38BDF8" filter="url(#textGlow)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="1" opacity=".8">AWESOME LARGE-SCALE SPATIAL SIMULATION</text><text x="600" y="130" fill="#FFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="1">AWESOME LARGE-SCALE SPATIAL SIMULATION</text><rect width="360" height="3" x="420" y="152" fill="url(#cyanOrb)" opacity=".9" rx="1.5"/><rect width="160" height="3" x="520" y="152" fill="#38BDF8" filter="url(#glow)" rx="1.5"/><text x="600" y="195" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="2">CITY-SCALE DIGITAL TWINS • AUTONOMOUS SYSTEMS • MULTI-AGENT ENGINES</text><g transform="translate(360, 222)"><rect width="130" height="26" x="0" y="0" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" s